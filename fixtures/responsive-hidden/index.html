<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Responsive Hidden Control Fixture</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* The second tab is hidden on narrow screens (a "tab strip" that would be replaced by a menu in a real course). */
  @media (max-width: 600px) { #t2 { display: none; } }
</style></head>
<body>
  <main>
    <h1>A control that only exists on wide screens</h1>
    <div role="tablist" aria-label="Topics">
      <button role="tab" id="t1" aria-selected="true" aria-controls="p1">One</button>
      <button role="tab" id="t2" aria-selected="false" aria-controls="p2">Two</button>
    </div>
    <div role="tabpanel" id="p1">Panel one.</div>
    <div role="tabpanel" id="p2" hidden>Panel two.</div>
  </main>
  <script>
    function pick(a, b, pa, pb) { document.getElementById(a).setAttribute('aria-selected', 'true'); document.getElementById(b).setAttribute('aria-selected', 'false'); document.getElementById(pa).hidden = false; document.getElementById(pb).hidden = true; }
    document.getElementById('t1').addEventListener('click', function () { pick('t1', 't2', 'p1', 'p2'); });
    document.getElementById('t2').addEventListener('click', function () { pick('t2', 't1', 'p2', 'p1'); });
  </script>
</body>
</html>
