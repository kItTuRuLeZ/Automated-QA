<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Gated quiz course</title>
<style>button{font:inherit;padding:.4rem .8rem;margin:.2rem}[hidden]{display:none!important}</style>
</head>
<body>
  <main>
    <h1 id="lesson-title">Lesson 1: Welcome</h1>
    <section id="quiz" hidden>
      <p>Which answer is correct?</p>
      <button type="button" id="opt-a">Option A</button>
      <button type="button" id="opt-b">Option B</button>
      <button type="button" id="opt-c">Option C</button>
      <button type="button" id="submit">Submit answer</button>
      <p id="feedback" role="status"></p>
    </section>
    <nav aria-label="Lesson navigation">
      <button type="button" id="next">Next</button>
    </nav>
  </main>
  <script>
    // Lessons 2 and 3 are quiz questions: Next stays disabled until "Option B" is chosen and "Submit answer" is pressed.
    var titles = ['Lesson 1: Welcome', 'Lesson 2: Quiz question', 'Lesson 3: Quiz question', 'Lesson 4: After the quiz'];
    var chosen = '', passedBy = {};
    function current() { var m = location.hash.match(/^#\/lessons\/(\d+)/); return m ? Math.min(Math.max(Number(m[1]), 1), 4) : 1; }
    function render() {
      var n = current();
      document.getElementById('lesson-title').textContent = titles[n - 1];
      document.title = titles[n - 1];
      document.getElementById('quiz').hidden = n !== 2 && n !== 3;
      document.getElementById('next').disabled = n === 4 || ((n === 2 || n === 3) && !passedBy[n]);
    }
    ['a', 'b', 'c'].forEach(function (k) { document.getElementById('opt-' + k).addEventListener('click', function () { chosen = k; }); });
    document.getElementById('submit').addEventListener('click', function () {
      passedBy[current()] = chosen === 'b';
      document.getElementById('feedback').textContent = passedBy[current()] ? 'Correct.' : 'Try again.';
      render();
    });
    document.getElementById('next').addEventListener('click', function () { location.hash = '#/lessons/' + (current() + 1); });
    window.addEventListener('hashchange', function () { chosen = ''; document.getElementById('feedback').textContent = ''; render(); });
    render();
  </script>
</body>
</html>
