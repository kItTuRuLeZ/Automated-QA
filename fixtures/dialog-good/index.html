<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Good Dialog Fixture</title></head>
<body>
  <main>
    <h1>Working dialog</h1>
    <button type="button" id="open" aria-haspopup="dialog" aria-controls="dlg">Open glossary</button>
    <button type="button">Other control one</button>
    <button type="button">Other control two</button>
    <div role="dialog" id="dlg" aria-modal="true" aria-labelledby="t" hidden>
      <h2 id="t" tabindex="-1">Glossary</h2>
      <p>Terms used in this course.</p>
      <button type="button" id="close">Close</button>
    </div>
  </main>
  <script>
    var opener, dlg = document.getElementById('dlg');
    function focusables() { return [].slice.call(dlg.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])')); }
    document.getElementById('open').addEventListener('click', function () {
      opener = this; dlg.hidden = false; document.getElementById('t').focus();
    });
    function close() { dlg.hidden = true; if (opener) opener.focus(); }
    document.getElementById('close').addEventListener('click', close);
    dlg.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
      if (e.key === 'Tab') {
        var f = focusables(), first = f[0], last = f[f.length - 1], a = document.activeElement;
        if (e.shiftKey && (a === first || a === document.getElementById('t'))) { e.preventDefault(); last.focus(); }
        else if (!e.shiftKey && a === last) { e.preventDefault(); first.focus(); }
      }
    });
  </script>
</body>
</html>
