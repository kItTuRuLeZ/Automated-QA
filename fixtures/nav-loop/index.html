<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Navigation Loop Fixture</title></head>
<body>
  <h1 id="screen"></h1>
  <button type="button" id="next">Next</button>
  <script>
    // Next cycles 1 -> 2 -> 3 -> 1 forever; the scanner must detect the loop.
    function n() { var m = location.hash.match(/^#\/screens\/(\d)/); return m ? Number(m[1]) : 1; }
    function render() { document.getElementById('screen').textContent = 'Screen ' + n(); }
    document.getElementById('next').addEventListener('click', function () { location.hash = '#/screens/' + (n() % 3 + 1); });
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
