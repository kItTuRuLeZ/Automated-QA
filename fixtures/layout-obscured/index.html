<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Covered Controls Fixture</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: sans-serif; }
  #covered { position: absolute; left: 20px; top: 90px; }
  #free { position: absolute; left: 20px; top: 200px; }
  #ghost-target { position: absolute; left: 20px; top: 260px; }
  #banner { position: fixed; left: 0; top: 70px; width: 100%; height: 70px; background: #fee2e2; border: 1px solid #b91c1c; box-sizing: border-box; padding: 8px 16px; }
  #ghost { position: fixed; left: 0; top: 245px; width: 100%; height: 60px; pointer-events: none; background: rgba(0,0,255,0.05); }
</style></head>
<body>
  <h1 style="margin:8px 20px">Controls under overlays</h1>
  <button type="button" id="covered">Submit order</button>
  <div id="banner">A fixed banner that sits on top of the button above</div>
  <button type="button" id="free">Not covered</button>
  <button type="button" id="ghost-target">Under a click-through overlay</button>
  <div id="ghost"></div>
</body>
</html>
