<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Auto quiz course</title>
<style>[hidden]{display:none!important}button{font:inherit;padding:.4rem .8rem;margin:.2rem}</style>
</head>
<body>
  <main>
    <h1 id="lesson-title">Lesson 1: Welcome</h1>
    <fieldset id="quiz" hidden>
      <legend>Pick one</legend>
      <label><input type="radio" name="q" value="a"> Answer A</label>
      <label><input type="radio" name="q" value="b"> Answer B</label>
      <button type="button" id="submit">Submit</button>
    </fieldset>
    <nav aria-label="Lesson navigation"><button type="button" id="next">Next</button></nav>
  </main>
  <script>
    // Lesson 2 asks a question. Any answer plus Submit unlocks Next.
    var titles = ['Lesson 1: Welcome', 'Lesson 2: A question', 'Lesson 3: After the question'];
    var done = false;
    function current() { var m = location.hash.match(/^#\/lessons\/(\d+)/); return m ? Math.min(Math.max(Number(m[1]), 1), 3) : 1; }
    function render() {
      var n = current();
      document.getElementById('lesson-title').textContent = titles[n - 1];
      document.title = titles[n - 1];
      document.getElementById('quiz').hidden = n !== 2;
      document.getElementById('next').disabled = n === 3 || (n === 2 && !done);
    }
    document.getElementById('submit').addEventListener('click', function () {
      if (document.querySelector('input[name=q]:checked')) { done = true; render(); }
    });
    document.getElementById('next').addEventListener('click', function () { location.hash = '#/lessons/' + (current() + 1); });
    window.addEventListener('hashchange', render);
    render();
  </script>
</body>
</html>
