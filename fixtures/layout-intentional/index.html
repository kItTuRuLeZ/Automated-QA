<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Intentional Overlap Fixture</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html, body { overflow-x: hidden; }
  body { margin: 0; font-family: sans-serif; }
  .offcanvas { position: absolute; left: 2000px; top: 0; width: 800px; }
  header { position: sticky; top: 0; background: #12233f; color: #fff; padding: 8px 16px; }
  main { padding: 16px; max-width: 340px; }
  .wrap { position: relative; display: inline-block; margin: 16px 0; }
  .badge { position: absolute; top: -8px; right: -8px; background: #c00; color: #fff; border-radius: 10px; padding: 0 6px; font-size: 12px; }
  .tip { position: absolute; left: 0; top: 36px; background: #222; color: #fff; padding: 4px 8px; font-size: 12px; white-space: nowrap; z-index: 5; }
  .hscroll { overflow-x: auto; width: 300px; border: 1px solid #888; }
  .hscroll > div { width: 1200px; padding: 8px; }
  .carousel { overflow: hidden; width: 300px; border: 1px solid #888; }
  .track { display: flex; width: 900px; transform: translateX(-300px); }
  .slide { width: 300px; padding: 8px; box-sizing: border-box; }
  #modal { position: fixed; left: 20px; top: 120px; width: 300px; background: #fff; border: 2px solid #333; padding: 12px; z-index: 20; box-sizing: border-box; }
  .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,0.2); z-index: 10; }
</style></head>
<body>
  <a href="#main" id="skip" style="position:absolute;top:0;left:0;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Skip to content</a>
  <div class="offcanvas">Off-canvas panel (the page hides sideways overflow)</div>
  <header>Sticky header</header>
  <main id="main">
    <h1>Overlaps that are on purpose</h1>
    <div class="wrap"><button type="button" id="inbox">Inbox <span class="badge">3</span></button></div>
    <div class="wrap"><button type="button" id="help">Help</button><div class="tip" role="tooltip">Tooltip over the next control</div></div>
    <div><button type="button" id="under-tip">Under the tooltip</button></div>
    <div class="hscroll"><div>Wide table-like content inside its own horizontal scroller (1200 px).</div></div>
    <div class="carousel"><div class="track"><div class="slide">Slide 1</div><div class="slide">Slide 2</div><div class="slide">Slide 3</div></div></div>
    <p><button type="button" id="behind-modal-1">Behind the modal</button> <button type="button" id="behind-modal-2">Also behind</button></p>
  </main>
  <div class="backdrop"></div>
  <div id="modal" role="dialog" aria-modal="true" aria-label="Notice"><p>A modal dialog covering the page on purpose.</p><button type="button" id="ok">OK</button></div>
</body>
</html>
