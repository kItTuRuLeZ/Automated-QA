<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Brand fixture</title><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: Arial, sans-serif; color: #000; }
  h1 { color: #1f4e9c; }
  .good { color: #1f4e9c; font-size: 16px; }
  .near { color: #214f9a; font-size: 16px; }
  .offcolor { color: #d9531e; font-size: 16px; }
  .offfont { font-family: Georgia, serif; color: #1f4e9c; font-size: 16px; }
  .tiny { font-size: 9px; color: #1f4e9c; }
</style></head>
<body>
  <main>
    <h1>Brand check page</h1>
    <p class="good">Approved font and colour.</p>
    <p class="near">A colour a few shades from the approved blue.</p>
    <p class="offcolor">Text in an orange that is not in the palette.</p>
    <p class="offfont">Text set in a serif font that is not approved.</p>
    <p class="tiny">Fine print that is very small.</p>
  </main>
</body>
</html>
